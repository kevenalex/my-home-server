# Configuração do Netdata (montada no container em /etc/netdata/netdata.conf).
# Só o que muda em relação ao padrão.

[web]
    # Escuta só na própria máquina e no IP do Tailscale do gladosserver.
    # Se o IP do Tailscale mudar, ajuste aqui (descubra com: tailscale ip -4).
    bind to = 127.0.0.1 100.117.213.66
    # Porta do painel (o padrão do Netdata é 19999).
    default port = 1025
