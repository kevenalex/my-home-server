# Alertas do Netdata (montado no container em /etc/netdata/health_alarm_notify.conf).
# O Netdata lê primeiro o arquivo padrão dele e depois este, então aqui fica
# só o que muda. Sem segredos: o token e o chat ID vêm de envs/telegram.env,
# que o docker-compose.yml passa para o container como variáveis de ambiente.

SEND_TELEGRAM="YES"
TELEGRAM_BOT_TOKEN="${TELEGRAM_TOKEN}"
DEFAULT_RECIPIENT_TELEGRAM="${TELEGRAM_CHAT_ID}"
