# /etc/smartd.conf do gladosserver
# Um SSD NVMe. Teste curto todo dia as 02h, teste longo todo sabado as 03h.
# -a            monitora todos os atributos de saude
# -W 4,45,55    avisa se a temperatura variar 4 graus, passar de 45 (info) ou 55 (critico)
# -M exec ...   chama o script que envia o alerta pelo Telegram
# -M test       manda um alerta de teste ao iniciar (REMOVA depois de confirmar que chegou)
/dev/nvme0 -a -d nvme -s (S/../.././02|L/../../6/03) -W 4,45,55 -m root -M exec /usr/local/bin/smartd-telegram.sh -M test
